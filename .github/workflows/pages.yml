name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # validates every question file and regenerates data.js
      - run: python build-data.py
      - run: mkdir _site && cp index.html app.js data.js diagrams.js summary.js style.css _site/
      # version-stamp asset URLs so phones never run stale JS; saved progress (localStorage) is untouched
      - run: sed -E -i "s/\.(js|css)\"/.\1?v=${GITHUB_SHA::7}\"/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
